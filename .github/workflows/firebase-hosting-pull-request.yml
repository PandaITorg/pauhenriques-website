# CI para PRs: verifica que el build de Next.js pasa sin errores.
# El deploy a producción lo maneja Firebase App Hosting (push a main → auto-deploy via apphosting.yaml).
name: Build check on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
