<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mockups — Pau Henriques</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #fafaf9;
    color: #1a1a1a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .container {
    max-width: 480px;
    width: 100%;
    padding: 2rem;
    text-align: center;
  }
  h1 {
    font-size: 1.25rem;
    font-weight: 500;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #666;
    margin-bottom: 0.5rem;
  }
  p {
    font-size: 0.875rem;
    color: #999;
    margin-bottom: 3rem;
  }
  .links {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  a {
    display: block;
    padding: 1rem 1.5rem;
    border: 1px solid #e5e5e5;
    border-radius: 8px;
    text-decoration: none;
    color: #1a1a1a;
    background: #fff;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  a:hover {
    border-color: #bbb;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .label {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #999;
    margin-bottom: 0.25rem;
  }
  .title {
    font-size: 1rem;
    font-weight: 500;
  }
</style>
</head>
<body>
<div class="container">
  <h1>Pau Henriques</h1>
  <p>Mockups de homepage para revisión</p>
  <div class="links">
    <a href="/mockup-v1.html">
      <div class="label">Versión 1</div>
      <div class="title">Homepage Mockup v1</div>
    </a>
    <a href="/mockup-v2.html">
      <div class="label">Versión 2</div>
      <div class="title">Homepage Mockup v2</div>
    </a>
  </div>
</div>
</body>
</html>
