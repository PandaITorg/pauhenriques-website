# Firebase App Hosting Configuration
# https://firebase.google.com/docs/app-hosting/configure

runtime: "nodejs18"

env:
  # Firebase Client SDK (NEXT_PUBLIC_*) - Públicas
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyCyDfV6yXA4-y2JSxniSdPU3RDwNTUEQEQ"
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "auth.pauhenriques.com"
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "pau-henriques-web-v1"
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "pau-henriques-web-v1.firebasestorage.app"
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "583869730474"
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:583869730474:web:35bd6a1364f4ebc1b0cad3"

  # Nuvei Payment Gateway - Client (NEXT_PUBLIC_*)
  - variable: NEXT_PUBLIC_NUVEI_CLIENT_APP_CODE
    value: "PAUHENRIQUES-EC-CLIENT"
  - variable: NEXT_PUBLIC_NUVEI_CLIENT_APP_KEY
    value: "SdwaMUQvmOLhrfOKXr3zYwmXm4Zphk"
  - variable: NEXT_PUBLIC_NUVEI_ENV
    value: "prod"

  # Firebase Admin SDK - SENSIBLES → Cloud Secret Manager
  - variable: FIREBASE_PROJECT_ID
    value: "pau-henriques-web-v1"
  - variable: FIREBASE_CLIENT_EMAIL
    secret: "firebase-client-email"
  - variable: FIREBASE_PRIVATE_KEY
    secret: "firebase-private-key"

  # Nuvei Payment Gateway - Server → Cloud Secret Manager
  - variable: NUVEI_SERVER_APP_CODE
    secret: "nuvei-server-app-code"
  - variable: NUVEI_SERVER_APP_KEY
    secret: "nuvei-server-app-key"
  - variable: NUVEI_ENV
    value: "prod"
  # Shared secret to authenticate the Nuvei webhook (DMN) endpoint. Incoming
  # POSTs must carry ?key=<this> (or x-webhook-key); mismatches → 401. Nuvei
  # does not currently call this endpoint for Pau, so this closes it as an
  # attack surface; if DMNs are enabled later, append ?key=<this> to the URL.
  - variable: NUVEI_WEBHOOK_SECRET
    secret: "nuvei-webhook-secret"

  # Email — Resend
  - variable: RESEND_API_KEY
    secret: "resend-api-key"

  # Cloudflare Turnstile — anti-bot en /pago/* guest checkout
  - variable: NEXT_PUBLIC_TURNSTILE_SITE_KEY
    value: "0x4AAAAAADBX42G53jvUB1Nb"
  - variable: TURNSTILE_SECRET_KEY
    secret: "turnstile-secret-key"
